<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Segmentation Pipeline</title>
<style>
  :root {
    --bg: #14161a;
    --panel: #1b1e24;
    --panel-2: #22262e;
    --line: #2e333d;
    --line-soft: #262b33;
    --text: #e6e8ec;
    --muted: #8d949f;
    --dim: #666d78;
    --accent: #6fb1ff;
    --accent-dim: #2c4d75;
    --warn: #e0a33e;
    --danger: #e06c6c;
    --radius: 7px;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, monospace;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 13px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    overflow: hidden;
  }
  button { font: inherit; color: inherit; cursor: pointer; }

  /* ---------- layout ---------- */
  .app { display: grid; grid-template-columns: 340px 1fr; height: 100vh; }
  .left {
    background: var(--panel);
    border-right: 1px solid var(--line);
    overflow-y: auto; overflow-x: hidden; min-height: 0;
    scrollbar-gutter: stable;
  }
  .left::-webkit-scrollbar { width: 10px; }
  .left::-webkit-scrollbar-thumb { background: #333944; border-radius: 5px; border: 3px solid var(--panel); }
  .right { display: flex; flex-direction: column; min-width: 0; min-height: 0; }

  /* ---------- headers ---------- */
  .hd {
    padding: 12px 14px; border-bottom: 1px solid var(--line);
    display: flex; align-items: center; gap: 8px;
    position: sticky; top: 0; z-index: 15; background: var(--panel);
  }
  .hd h1 { margin: 0; font-size: 13px; font-weight: 600; letter-spacing: .01em; }
  .hd .sub { font: 11px var(--mono); color: var(--dim); margin-left: auto; }
  .pick {
    background: var(--panel-2); color: var(--text); border: 1px solid var(--line);
    border-radius: 5px; padding: 3px 6px; font: 11.5px var(--mono); min-width: 0;
  }
  .pick:hover, .pick:focus-visible { border-color: var(--accent); outline: none; }

  /* ---------- blocks ---------- */
  .blocks { padding: 10px; display: flex; flex-direction: column; gap: 8px; }

  .block {
    background: var(--panel-2); border: 1px solid var(--line);
    border-radius: var(--radius); overflow: hidden;
    transition: border-color .12s, opacity .12s;
  }
  .block.dragging { opacity: .35; border-color: var(--accent); }
  .block.disabled .body { opacity: .35; pointer-events: none; }
  .block.disabled .title { color: var(--dim); text-decoration: line-through; }
  .block.err { border-color: var(--danger); }

  .bhead { display: flex; align-items: center; gap: 7px; padding: 8px 9px; }
  .grip {
    cursor: grab; color: var(--dim); flex: 0 0 auto; padding: 2px 1px;
    line-height: 1; font-size: 13px; letter-spacing: 1px; user-select: none;
  }
  .grip:active { cursor: grabbing; }
  .title { font-weight: 600; font-size: 12.5px; flex: 1 1 auto; min-width: 0;
           overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .num { font: 10px var(--mono); color: var(--dim); flex: 0 0 auto; }
  .iconbtn {
    background: none; border: 0; color: var(--dim); padding: 2px 5px;
    border-radius: 4px; line-height: 1; font-size: 12px;
  }
  .iconbtn:hover { background: #2e343e; color: var(--text); }

  /* Enable switch. Was a ●/○ glyph styled as .iconbtn, which read as a second
     icon button beside the ✕ rather than as state you can flip. */
  .sw {
    position: relative; flex: 0 0 auto; width: 26px; height: 15px; padding: 0;
    border: 1px solid var(--line); border-radius: 8px; background: var(--panel);
    transition: background .14s, border-color .14s;
  }
  .sw::after {
    content: ""; position: absolute; top: 2px; left: 2px;
    width: 9px; height: 9px; border-radius: 50%; background: var(--dim);
    transition: transform .14s, background .14s;
  }
  .sw:hover { border-color: var(--muted); }
  .sw[aria-checked="true"] { background: var(--accent-dim); border-color: var(--accent); }
  .sw[aria-checked="true"]:hover { border-color: var(--accent); }
  .sw[aria-checked="true"]::after { background: var(--accent); transform: translateX(11px); }
  .sw:focus-visible { outline: none; box-shadow: 0 0 0 3px var(--accent-dim); }
  .iconbtn.x:hover { color: var(--danger); }

  .body { padding: 0 10px 10px; }
  .hint { font-size: 11px; color: var(--dim); margin: -2px 0 9px; line-height: 1.45; }

  .row { margin-bottom: 9px; }
  .row:last-child { margin-bottom: 2px; }
  .rlabel { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 3px; }
  .rlabel span:first-child { font-size: 11.5px; color: var(--muted); }
  .val { font: 11px var(--mono); color: var(--accent); }

  input[type=range] {
    -webkit-appearance: none; appearance: none;
    width: 100%; height: 16px; background: transparent; margin: 0; cursor: pointer;
  }
  input[type=range]::-webkit-slider-runnable-track {
    height: 3px; border-radius: 2px; background: var(--line);
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none;
    width: 12px; height: 12px; margin-top: -4.5px;
    border-radius: 50%; background: var(--accent); border: 0;
  }
  input[type=range]:focus-visible::-webkit-slider-thumb { box-shadow: 0 0 0 3px var(--accent-dim); }

  .seg { display: flex; gap: 3px; }
  .seg button {
    flex: 1 1 0; background: var(--panel); border: 1px solid var(--line);
    border-radius: 5px; padding: 4px 2px; font-size: 11px; color: var(--muted);
  }
  .seg button.on { background: var(--accent-dim); border-color: var(--accent); color: #fff; }

  .ghead {
    font-size: 10px; color: var(--dim); text-transform: uppercase; letter-spacing: .06em;
    margin: 12px 0 5px; padding-top: 7px; border-top: 1px solid var(--line-soft);
  }
  .row.off .rlabel span:first-child { color: var(--dim); }
  .row.off .val { color: var(--dim); }
  .row.mapped .rlabel span:first-child { color: var(--accent); }
  .row.mapped .rlabel span:first-child::after { content: "  ◉ mapped"; font-size: 10px; }

  .blockerr { font: 11px var(--mono); color: var(--danger); padding: 0 10px 9px; }
  .blockdetail {
    font: 10.5px var(--mono); color: var(--muted); padding: 0 10px 9px;
    margin-top: -4px; letter-spacing: .02em;
  }

  /* ---------- add menu ---------- */
  .foot {
    border-top: 1px solid var(--line); padding: 10px;
    position: sticky; bottom: 0; z-index: 15; background: var(--panel);
  }
  .wide {
    width: 100%; background: var(--panel-2); border: 1px solid var(--line);
    border-radius: var(--radius); padding: 8px; color: var(--text); font-size: 12.5px;
  }
  .wide:hover { border-color: var(--accent); }
  /* Geometry (left/width/top/max-height) comes from placeMenu(): anchored to
     .foot it was clipped by .left's overflow, with no way to scroll to the
     part that ran off the top. */
  .menu {
    position: fixed; z-index: 20;
    background: var(--panel-2); border: 1px solid var(--line); border-radius: var(--radius);
    box-shadow: 0 10px 30px #0009; overflow-y: auto; padding: 5px;
  }
  .menu[hidden] { display: none; }
  .menu button {
    display: block; width: 100%; text-align: left; background: none; border: 0;
    padding: 7px 8px; border-radius: 5px;
  }
  .menu button:hover { background: var(--accent-dim); }
  .menu .mt { font-size: 12.5px; font-weight: 500; }
  .menu .mh { font-size: 10.5px; color: var(--dim); margin-top: 1px; }
  .menu button:hover .mh { color: #c3ccd8; }

  .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; margin-top: 7px; }
  .actions button { padding: 7px; font-size: 11.5px; }
  .actions .primary { border-color: var(--accent-dim); }
  .actions .span { grid-column: 1 / -1; }

  /* ---------- viewer ---------- */
  .stagebar {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 14px; border-bottom: 1px solid var(--line); flex: 0 0 auto;
  }
  .stagename { font-weight: 600; font-size: 13px; }
  .meta { font: 11px var(--mono); color: var(--dim); }
  .spacer { flex: 1 1 auto; }
  .pill {
    font: 10.5px var(--mono); color: var(--muted);
    border: 1px solid var(--line); border-radius: 20px; padding: 2px 9px;
  }

  .stage {
    flex: 1 1 auto; position: relative; min-height: 0;
    display: flex; align-items: center; justify-content: center;
    padding: 18px; overflow: hidden;
    background:
      linear-gradient(45deg, #1a1d22 25%, transparent 25%) 0 0/22px 22px,
      linear-gradient(-45deg, #1a1d22 25%, transparent 25%) 0 11px/22px 22px,
      linear-gradient(45deg, transparent 75%, #1a1d22 75%) 11px -11px/22px 22px,
      linear-gradient(-45deg, transparent 75%, #1a1d22 75%) -11px 0/22px 22px,
      var(--bg);
  }
  .stage canvas {
    max-width: 100%; max-height: 100%; object-fit: contain;
    box-shadow: 0 6px 34px #000a; border-radius: 2px;
    image-rendering: -webkit-optimize-contrast;
  }

  .film {
    flex: 0 0 auto; border-top: 1px solid var(--line);
    display: flex; gap: 8px; padding: 10px 14px; overflow-x: auto; align-items: flex-end;
  }
  .film::-webkit-scrollbar { height: 8px; }
  .film::-webkit-scrollbar-thumb { background: #333944; border-radius: 4px; }
  .frame { flex: 0 0 auto; width: 84px; cursor: pointer; text-align: center; }
  .frame canvas {
    width: 84px; height: 62px; object-fit: contain; display: block;
    background: #0f1114; border: 1px solid var(--line); border-radius: 5px;
  }
  .frame.on canvas { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
  .frame .cap {
    font-size: 10px; color: var(--dim); margin-top: 4px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .frame.on .cap { color: var(--accent); }

  .empty { color: var(--dim); font-size: 12.5px; text-align: center; padding: 30px 12px; }
  .busy { position: absolute; top: 12px; left: 14px; font: 11px var(--mono); color: var(--accent); }
  .busy[hidden] { display: none; }
</style>
</head>
<body>
<div class="app">
  <!-- ============ LEFT: pipeline ============ -->
  <aside class="left">
    <div class="hd">
      <h1>Pipeline</h1>
      <select class="pick" id="imgpick" aria-label="Source image" disabled></select>
      <span class="sub" id="srcinfo">—</span>
    </div>
    <div class="blocks" id="blocks"></div>
    <div class="foot">
      <div class="menu" id="menu" hidden></div>
      <button class="wide" id="addbtn">+ Add operation</button>
      <div class="actions">
        <button class="wide" id="importtxt" title="Load the pipeline and image from a file saved by Export TXT">Import TXT</button>
        <button class="wide" id="exporttxt" title="Write the pipeline and its parameters to a text file">Export TXT</button>
        <button class="wide primary" id="exportmask" title="Binary 0/255 mask at the source size, for evaluate.py">Export mask</button>
        <button class="wide" id="exportbtn" title="Whatever the last stage shows, as a PNG">Export PNG</button>
        <button class="wide span" id="resetbtn" title="Back to defaults, and forget the saved pipeline">Reset</button>
        <input type="file" id="importfile" accept=".txt,text/plain" hidden>
      </div>
    </div>
  </aside>

  <!-- ============ RIGHT: gallery ============ -->
  <main class="right">
    <div class="stagebar">
      <span class="stagename" id="sname">—</span>
      <span class="meta" id="smeta"></span>
      <span class="spacer"></span>
      <span class="pill" id="scount">—</span>
      <span class="pill" id="stime">—</span>
    </div>
    <div class="stage" id="stage">
      <span class="busy" id="busy" hidden>processing…</span>
      <canvas id="view" aria-label="Pipeline stage output"></canvas>
    </div>
    <div class="film" id="film"></div>
  </main>
</div>

<script>
"use strict";

const $ = (id) => document.getElementById(id);

let SCHEMA = null;      // operation registry, from pipeline.OPERATIONS
let pipe = [];          // [{uid, type, params, enabled}]
let stages = [];        // per-stage metadata from the last run
let selected = 0;       // index into stages
let followFinal = true; // stay pinned to the last stage as the pipeline grows
let uidSeq = 0;
let ready = false;
let restoredNote = false;

const STORE_KEY = "davis-seg:pipeline";
const IMAGE_KEY = "davis-seg:image";
let images = [];        // manifest entries: [{sequence, frame, image, ...}]

let preview = null;             // ImageData for the big view
const thumbs = new Map();       // stage index -> ImageData, kept across runs

/* ------------------------------------------------------------------ boot */
/* Python lives in a worker. Keeping OpenCV off this thread is what lets a
 * slider stay at 60fps while a run is in flight -- the drag never waits on
 * the pipeline, it just queues the next one. */
const worker = new Worker("worker.js");

worker.onmessage = (e) => {
  const m = e.data;
  if (m.type === "status") setBusy(m.text);
  else if (m.type === "ready") onReady(m);
  else if (m.type === "source") onSource(m);
  else if (m.type === "result") onResult(m);
  else if (m.type === "png") onPng(m);
  else if (m.type === "error") onError(m);
};
worker.onerror = (e) => onError({ message: e.message || "worker failed to start" });

/* The image list comes from manifest.json.  Only each entry's `image` path
 * is used -- the mask paths in there are ground truth and stay unopened. */
async function boot() {
  setBusy("starting…");
  try {
    const res = await fetch("manifest.json", { cache: "no-cache" });
    if (!res.ok) throw new Error(`manifest.json: HTTP ${res.status}`);
    images = (await res.json()).map((e) => ({ sequence: e.sequence, frame: e.frame, image: e.image }));
  } catch (err) {
    onError({ message: `${err.message} — serve this folder over HTTP (see README)` });
    return;
  }
  let saved = null;
  try { saved = localStorage.getItem(IMAGE_KEY); } catch (err) { /* private mode */ }
  const initial = images.find((e) => e.image === saved) || images[0];

  const pick = $("imgpick");
  pick.innerHTML = "";
  images.forEach((e) => {
    const o = document.createElement("option");
    o.value = e.image;
    o.textContent = e.sequence;
    pick.appendChild(o);
  });
  pick.value = initial.image;
  worker.postMessage({ cmd: "init", image: initial.image });
}

function setSourceInfo(raw) {
  SCHEMA.source = JSON.parse(raw);
  const s = SCHEMA.source;
  $("srcinfo").textContent = `${s.width}×${s.height}`;
}

/* Swapping the image keeps the pipeline and invalidates every stage.  Runs
 * are held off until the worker has the new source, so nothing in flight can
 * paint the old image over the new one. */
$("imgpick").onchange = () => switchImage($("imgpick").value);

function switchImage(image) {
  $("imgpick").value = image;
  try { localStorage.setItem(IMAGE_KEY, image); } catch (err) { /* private mode */ }
  ready = false;
  $("imgpick").disabled = true;
  setBusy("loading image…");
  worker.postMessage({ cmd: "source", image });
}

function onSource(m) {
  setSourceInfo(m.source);
  stages = [];            // forces a full set of fresh thumbs
  thumbs.clear();
  ready = true;
  $("imgpick").disabled = false;
  clearBusy();
  run();
}

function onReady(m) {
  SCHEMA = JSON.parse(m.schema);
  setSourceInfo(m.source);
  ready = true;
  $("imgpick").disabled = false;
  clearBusy();
  buildMenu();

  const saved = loadSaved();
  restoredNote = !!saved;
  start(saved || defaultPipe());
}

function setBusy(text) { $("busy").textContent = text; $("busy").hidden = false; }
function clearBusy() { $("busy").hidden = true; }

// rebuild() fills every param from the spec, so a default block that lists
// only some params (or none) still shows controls matching what it computes
function defaultPipe() {
  return rebuild(SCHEMA.default_pipeline) || [];
}

function start(ops) {
  pipe = ops;
  followFinal = true;
  renderBlocks();
  run();
}

function loadDefault() {          // Reset: defaults, and forget the saved pipeline
  try { localStorage.removeItem(STORE_KEY); } catch (err) { /* nothing to clear */ }
  start(defaultPipe());
}

/* ---------------------------------------------------------- persistence */
/* Hand-tuned values survive a reload. pipeline.py changes underneath this
 * file -- ops get added, params get renamed, ranges move -- so anything
 * restored is rebuilt against the current registry rather than trusted. */
function savePipeline() {
  try {
    localStorage.setItem(STORE_KEY, JSON.stringify(
      pipe.map((o) => ({ type: o.type, params: o.params, enabled: o.enabled }))));
  } catch (err) {
    console.warn("pipeline not saved:", err);   // private mode, or quota
  }
}

function rebuild(saved) {
  if (!Array.isArray(saved)) return null;
  const out = [];
  for (const op of saved) {
    const spec = op && SCHEMA.operations[op.type];
    if (!spec) continue;                        // op no longer exists
    const params = {};
    spec.params.forEach((p) => {
      const v = op.params ? op.params[p.key] : undefined;
      if (typeof v !== "number" || !isFinite(v)) {
        params[p.key] = p.default;              // param added or renamed since
      } else if (p.choices) {
        params[p.key] = v >= 0 && v < p.choices.length ? v : p.default;
      } else {
        params[p.key] = Math.min(p.max, Math.max(p.min, v));   // range may have moved
      }
    });
    out.push({ uid: ++uidSeq, type: op.type, params, enabled: op.enabled !== false });
  }
  return out.length ? out : null;
}

function loadSaved() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    return raw ? rebuild(JSON.parse(raw)) : null;
  } catch (err) {
    console.warn("saved pipeline unreadable, using defaults:", err);
    return null;
  }
}

/* ------------------------------------------------- left panel rendering */
function renderBlocks() {
  const host = $("blocks");
  host.innerHTML = "";
  if (!pipe.length) {
    host.innerHTML = '<div class="empty">No operations yet.<br>Add one below.</div>';
  }
  pipe.forEach((op, i) => host.appendChild(blockEl(op, i)));
}

function blockEl(op, index) {
  const spec = SCHEMA.operations[op.type];
  const el = document.createElement("div");
  el.className = "block" + (op.enabled ? "" : " disabled");
  el.dataset.uid = op.uid;

  const head = document.createElement("div");
  head.className = "bhead";

  const grip = document.createElement("span");
  grip.className = "grip";
  grip.textContent = "⠿";
  grip.title = "Drag to reorder";

  const num = document.createElement("span");
  num.className = "num";
  num.textContent = String(index + 1).padStart(2, "0");

  const title = document.createElement("span");
  title.className = "title";
  title.textContent = spec.label;

  const sw = document.createElement("button");
  sw.className = "sw";
  sw.type = "button";
  sw.setAttribute("role", "switch");
  sw.setAttribute("aria-checked", String(op.enabled));
  sw.setAttribute("aria-label", `${spec.label} enabled`);
  sw.title = op.enabled ? "Disable this step" : "Enable this step";
  /* Flip in place rather than via renderBlocks(): a full rebuild replaces the
     element, which kills the knob transition and drops keyboard focus. */
  sw.onclick = () => {
    op.enabled = !op.enabled;
    sw.setAttribute("aria-checked", String(op.enabled));
    sw.title = op.enabled ? "Disable this step" : "Enable this step";
    el.classList.toggle("disabled", !op.enabled);
    run();
  };

  const del = document.createElement("button");
  del.className = "iconbtn x";
  del.textContent = "✕";
  del.title = "Remove";
  del.onclick = () => {
    pipe = pipe.filter((o) => o.uid !== op.uid);
    renderBlocks(); run();
  };

  head.append(grip, num, title, sw, del);
  el.appendChild(head);

  const body = document.createElement("div");
  body.className = "body";
  el.appendChild(body);
  renderBody(op, el);

  wireDrag(el, grip);
  return el;
}

/* A param may declare `when: {key: value}` -- SLIC's sigma only applies with
 * smoothing on. Hiding the inapplicable ones beats showing dead controls.
 * `hidden` params are driven by other controls and never drawn. */
function matches(value, want) {
  return Array.isArray(want) ? want.some((w) => Number(w) === Number(value))
                             : Number(want) === Number(value);
}

// a param that other params' `when` refers to changes which controls belong
function gates(op, key) {
  return SCHEMA.operations[op.type].params.some((q) => q.when && key in q.when);
}

function visibleParams(spec, op) {
  return spec.params.filter((p) => !p.hidden && (!p.when ||
    Object.keys(p.when).every((k) => matches(op.params[k], p.when[k]))));
}

function renderBody(op, el) {
  const spec = SCHEMA.operations[op.type];
  const body = el.querySelector(".body");
  body.innerHTML = "";
  if (spec.hint) {
    const h = document.createElement("div");
    h.className = "hint";
    h.textContent = spec.hint;
    body.appendChild(h);
  }
  let group = null;
  visibleParams(spec, op).forEach((p) => {
    if (p.group && p.group !== group) {
      const g = document.createElement("div");
      g.className = "ghead";
      g.textContent = p.group;
      body.appendChild(g);
    }
    group = p.group || null;
    body.appendChild(controlEl(op, p, el));
  });
  markMapped(op, el);
}

/* `on_touch` params (feature weights) set other params when pressed or
 * dragged -- here, switch the view to that feature's map.  The body is not
 * re-rendered, since that would replace the slider mid-drag; the affected
 * choice buttons are updated in place instead. */
function applyTouch(op, p, el) {
  if (!p.on_touch) return;
  Object.assign(op.params, p.on_touch);
  Object.entries(p.on_touch).forEach(([key, value]) => {
    el.querySelectorAll(`.row[data-key="${key}"] .seg button`).forEach((b, bi) => {
      b.classList.toggle("on", bi === Number(value));
    });
  });
  markMapped(op, el);
}

// Highlight the weight whose map is on screen. The pairing is read from the
// params' own on_touch specs rather than assumed.
function markMapped(op, el) {
  SCHEMA.operations[op.type].params.forEach((p) => {
    if (!p.on_touch) return;
    const row = el.querySelector(`.row[data-key="${p.key}"]`);
    if (!row) return;
    const on = Object.entries(p.on_touch).every(([k, v]) => Number(op.params[k]) === Number(v));
    row.classList.toggle("mapped", on);
  });
}

function decimals(step) {
  const s = String(step);
  return s.includes(".") ? s.split(".")[1].length : 0;
}

function controlEl(op, p, el) {
  const row = document.createElement("div");
  row.className = "row";
  row.dataset.key = p.key;

  if (p.choices) {
    const lab = document.createElement("div");
    lab.className = "rlabel";
    lab.innerHTML = `<span>${p.label}</span>`;
    row.appendChild(lab);

    const seg = document.createElement("div");
    seg.className = "seg";
    p.choices.forEach((choice, ci) => {
      const b = document.createElement("button");
      b.textContent = choice;
      if (Number(op.params[p.key]) === ci) b.classList.add("on");
      b.onclick = () => {
        op.params[p.key] = ci;
        if (gates(op, p.key)) {
          renderBody(op, el);
        } else {
          seg.querySelectorAll("button").forEach((x) => x.classList.remove("on"));
          b.classList.add("on");
          markMapped(op, el);
        }
        run();
      };
      seg.appendChild(b);
    });
    row.appendChild(seg);
    return row;
  }

  const dp = decimals(p.step);
  const lab = document.createElement("div");
  lab.className = "rlabel";
  const name = document.createElement("span");
  name.textContent = p.label;
  const val = document.createElement("span");
  val.className = "val";

  const cur = op.params[p.key] ?? p.default;
  // a weight at 0 is a feature switched off; grey it so the live ones stand out
  const show = (v) => {
    val.textContent = Number(v).toFixed(dp) + (p.unit ? " " + p.unit : "");
    if (p.on_touch) row.classList.toggle("off", Number(v) <= 0);
  };
  show(cur);
  lab.append(name, val);
  row.appendChild(lab);

  const slider = document.createElement("input");
  slider.type = "range";
  slider.min = p.min; slider.max = p.max; slider.step = p.step; slider.value = cur;
  slider.oninput = () => {
    const v = p.step % 1 === 0 ? parseInt(slider.value, 10) : parseFloat(slider.value);
    op.params[p.key] = v;
    show(v);
    applyTouch(op, p, el);
    run();
  };
  // pressing without moving still counts as touching: show the map
  if (p.on_touch) slider.addEventListener("pointerdown", () => { applyTouch(op, p, el); run(); });
  row.appendChild(slider);
  return row;
}

/* ------------------------------------------------------ drag to reorder */
function wireDrag(el, grip) {
  grip.addEventListener("mousedown", () => { el.draggable = true; });
  el.addEventListener("dragstart", (e) => {
    el.classList.add("dragging");
    e.dataTransfer.effectAllowed = "move";
    e.dataTransfer.setData("text/plain", el.dataset.uid);
  });
  el.addEventListener("dragend", () => {
    el.classList.remove("dragging");
    el.draggable = false;
    syncOrderFromDom();
  });
}

$("blocks").addEventListener("dragover", (e) => {
  e.preventDefault();
  const dragging = document.querySelector(".block.dragging");
  if (!dragging) return;
  const after = afterElement($("blocks"), e.clientY);
  if (after == null) $("blocks").appendChild(dragging);
  else $("blocks").insertBefore(dragging, after);
});

function afterElement(container, y) {
  const others = [...container.querySelectorAll(".block:not(.dragging)")];
  let best = null, bestOffset = Number.NEGATIVE_INFINITY;
  for (const child of others) {
    const box = child.getBoundingClientRect();
    const offset = y - box.top - box.height / 2;
    if (offset < 0 && offset > bestOffset) { bestOffset = offset; best = child; }
  }
  return best;
}

function syncOrderFromDom() {
  const order = [...$("blocks").querySelectorAll(".block")].map((el) => Number(el.dataset.uid));
  const before = pipe.map((o) => o.uid).join(",");
  pipe.sort((a, b) => order.indexOf(a.uid) - order.indexOf(b.uid));
  if (pipe.map((o) => o.uid).join(",") === before) return; // nothing moved
  renderBlocks();
  run();
}

/* ------------------------------------------------------------ add menu */
function buildMenu() {
  const menu = $("menu");
  menu.innerHTML = "";
  SCHEMA.order.forEach((key) => {
    const spec = SCHEMA.operations[key];
    const b = document.createElement("button");
    b.innerHTML = `<div class="mt">${spec.label}</div><div class="mh">${spec.hint}</div>`;
    b.onclick = () => {
      const params = {};
      spec.params.forEach((p) => { params[p.key] = p.default; });
      pipe.push({ uid: ++uidSeq, type: key, params, enabled: true });
      menu.hidden = true;
      followFinal = true;
      renderBlocks();
      document.querySelector(".left").scrollTop = 1e6;
      run();
    };
    menu.appendChild(b);
  });
}

/* Open toward whichever side of the button has more room, capped to the space
 * actually there, so the list scrolls internally instead of off screen. */
function placeMenu() {
  const menu = $("menu");
  const r = $("addbtn").getBoundingClientRect();
  const GAP = 6, EDGE = 10;
  const above = r.top - GAP - EDGE;
  const below = innerHeight - r.bottom - GAP - EDGE;
  const up = above >= below;

  menu.style.left = `${r.left}px`;
  menu.style.width = `${r.width}px`;
  menu.style.maxHeight = `${Math.max(120, up ? above : below)}px`;
  // read the height only after the cap applies, so a clamped menu sits flush
  menu.style.top = up ? `${Math.max(EDGE, r.top - GAP - menu.offsetHeight)}px`
                      : `${r.bottom + GAP}px`;
}

function toggleMenu(show) {
  const menu = $("menu");
  menu.hidden = !show;
  if (show) placeMenu();
}

$("addbtn").onclick = (e) => { e.stopPropagation(); toggleMenu($("menu").hidden); };
document.addEventListener("click", (e) => {
  if (!$("menu").hidden && !$("menu").contains(e.target) && e.target !== $("addbtn")) {
    toggleMenu(false);
  }
});
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") toggleMenu(false);
});
// the button rides a sticky footer, so both of these can move it
addEventListener("resize", () => { if (!$("menu").hidden) placeMenu(); });
document.querySelector(".left").addEventListener("scroll", () => {
  if (!$("menu").hidden) placeMenu();
});
$("resetbtn").onclick = loadDefault;

/* ------------------------------------------------------------ processing */
/* No debounce. The first slider move dispatches immediately; moves that
 * arrive while the worker is busy collapse into a single follow-up run, so
 * felt latency is one pipeline pass rather than a fixed timeout plus one. */
let busy = false, pending = false, busyTimer = null, saveTimer = null;

function run() {
  if (!ready) return;
  // localStorage writes are synchronous; keep them out of the drag
  clearTimeout(saveTimer);
  saveTimer = setTimeout(savePipeline, 400);
  pending = true;
  pump();
}

function pump() {
  if (busy || !pending) return;
  pending = false;
  busy = true;
  // only admit to being busy if it lasts long enough to notice
  busyTimer = setTimeout(() => setBusy("processing…"), 120);
  worker.postMessage({
    cmd: "run",
    ops: pipe.map((o) => ({ type: o.type, params: o.params, enabled: o.enabled })),
    // followFinal means "whatever the last stage turns out to be"; bridge clamps
    selected: followFinal ? 1e6 : selected,
    all: !stages.length,
  });
}

function idle() {
  clearTimeout(busyTimer);
  clearBusy();
  busy = false;
  pump();
}

function onResult(m) {
  const meta = m.meta;
  stages = meta.stages;
  selected = meta.selected;
  followFinal = selected === stages.length - 1;

  preview = new ImageData(new Uint8ClampedArray(m.preview.data), m.preview.width, m.preview.height);
  for (const t of m.thumbs) {
    thumbs.set(t.index, new ImageData(new Uint8ClampedArray(t.data), t.width, t.height));
  }
  for (const i of [...thumbs.keys()]) if (i >= stages.length) thumbs.delete(i);

  $("stime").textContent = meta.reused
    ? `${meta.total_ms} ms · ${meta.reused} cached`
    : `${meta.total_ms} ms`;

  renderStageInfo();
  renderFilm();
  renderChrome();
  paint();
  idle();

  if (restoredNote) {
    restoredNote = false;
    setBusy("restored your saved pipeline");
    setTimeout(clearBusy, 2200);
  }
}

function onError(m) {
  console.error(m.message);
  $("sname").textContent = m.message;
  if (SCHEMA && !ready) {   // a failed image swap: stay on the old source
    ready = true;
    $("imgpick").disabled = false;
    if (SCHEMA.source) $("imgpick").value = SCHEMA.source.path;
  }
  finishExport();
  idle();
}

function renderStageInfo() {
  document.querySelectorAll(".block").forEach((el) => {
    el.classList.remove("err");
    el.querySelector(".blockerr")?.remove();
    el.querySelector(".blockdetail")?.remove();
  });
  // stages[0] is the source; enabled blocks map onto stages 1..n in order
  const enabled = pipe.filter((o) => o.enabled);
  stages.slice(1).forEach((st, i) => {
    const block = enabled[i] && document.querySelector(`.block[data-uid="${enabled[i].uid}"]`);
    if (!block) return;
    if (st.detail) {
      const d = document.createElement("div");
      d.className = "blockdetail";
      d.textContent = "→ " + st.detail;
      block.appendChild(d);
    }
    if (st.error) {
      block.classList.add("err");
      const e = document.createElement("div");
      e.className = "blockerr";
      e.textContent = st.error;
      block.appendChild(e);
    }
  });
}

/* -------------------------------------------------------------- gallery */
function paint() {
  if (!preview) return;
  const c = $("view");
  c.width = preview.width;          // also clears the canvas
  c.height = preview.height;
  c.getContext("2d").putImageData(preview, 0, 0);
}

/* Picking a stage updates the chrome now and the pixels on the next result.
 * The pipeline itself is fully cached at that point, so the worker only has
 * to re-encode one preview -- a couple of milliseconds. */
function showStage(i) {
  if (!stages.length) return;
  selected = Math.max(0, Math.min(i, stages.length - 1));
  followFinal = selected === stages.length - 1;
  renderChrome();
  run();
}

function renderChrome() {
  if (!stages.length) return;
  const st = stages[selected];

  $("sname").textContent = st.label;
  $("smeta").textContent = `${st.width}×${st.height} · ${st.channels === 1 ? "1 ch" : "3 ch"}`
    + (st.detail ? ` · ${st.detail}` : "");
  $("scount").textContent = `${selected + 1} / ${stages.length}`;

  document.querySelectorAll(".frame").forEach((f, fi) => f.classList.toggle("on", fi === selected));
  document.querySelectorAll(".frame")[selected]?.scrollIntoView({ block: "nearest", inline: "nearest" });
}

function renderFilm() {
  const film = $("film");
  film.innerHTML = "";
  stages.forEach((st, i) => {
    const f = document.createElement("div");
    f.className = "frame" + (i === selected ? " on" : "");
    const c = document.createElement("canvas");
    const data = thumbs.get(i);
    if (data) {
      c.width = data.width;
      c.height = data.height;
      c.getContext("2d").putImageData(data, 0, 0);
    }
    const cap = document.createElement("div");
    cap.className = "cap";
    cap.textContent = `${i}. ${st.label}`;
    f.append(c, cap);
    f.onclick = () => showStage(i);
    film.appendChild(f);
  });
}


document.addEventListener("keydown", (e) => {
  // let arrow keys nudge a focused slider instead of changing stage
  if (e.target instanceof HTMLInputElement) return;
  if (e.key === "ArrowLeft") { e.preventDefault(); showStage(selected - 1); }
  if (e.key === "ArrowRight") { e.preventDefault(); showStage(selected + 1); }
});

/* --------------------------------------------------------------- extras */
/* Export re-runs at full source resolution, so it can take a second or two
 * where an interactive run takes tens of milliseconds. */
let exporting = null;    // {btn, label} while an export is in flight

function finishExport() {
  if (exporting === null) return;
  exporting.btn.textContent = exporting.label;
  exporting.btn.disabled = false;
  exporting = null;
}

function onPng(m) {
  const kind = m.kind === "mask" ? "mask" : "segmentation";
  download(new Blob([m.data], { type: "image/png" }), `${stem(kind)}-${stamp()}.png`);
  finishExport();
}

function startExport(btn, kind) {
  if (!ready || exporting !== null) return;
  exporting = { btn, label: btn.textContent };
  btn.textContent = "Rendering…";
  btn.disabled = true;
  worker.postMessage({
    cmd: "export",
    kind,
    ops: pipe.map((o) => ({ type: o.type, params: o.params, enabled: o.enabled })),
  });
}

/* A readable record of the pipeline: every block in order with its parameter
 * values, the derived readouts the sliders only imply, the shape each stage
 * produced, and a runnable transcript at the end. */
function pipelineText() {
  const src = SCHEMA.source;
  const pad = (s, w) => String(s).padEnd(w);
  const out = [];

  out.push("Segmentation pipeline");
  out.push("=====================");
  out.push(`Source    ${src.path}  ${src.width}×${src.height}`);
  out.push(`Exported  ${new Date().toString()}`);
  if (pipe.some((o) => o.enabled && o.type === "slic")) {
    out.push("Seed      SLIC: n/a -- seeds on a regular grid, so runs are deterministic");
  }
  pipe.filter((o) => o.enabled && o.type === "kmeans").forEach((o) => {
    out.push(`          k-means: seed ${o.params.seed} (numpy default_rng, k-means++, ${o.params.n_init} restarts)`);
  });
  out.push("");

  // stages[0] is the source; enabled blocks map onto stages 1..n in order
  const live = pipe.filter((o) => o.enabled);
  let step = 0;
  pipe.forEach((op) => {
    const spec = SCHEMA.operations[op.type];
    const st = op.enabled ? stages[live.indexOf(op) + 1] : null;
    const head = op.enabled ? `${String(++step).padStart(2)}. ${spec.label}`
                            : `    ${spec.label}`;
    out.push(op.enabled && st
      ? `${pad(head, 36)}${st.width}×${st.height} · ${st.channels === 1 ? "1 ch" : "3 ch"}`
      : `${pad(head, 36)}${op.enabled ? "" : "(disabled)"}`);
    if (st && st.detail) out.push(`      → ${st.detail}`);
    // the listing documents what applied; Reproduce below still passes every
    // param, so the transcript stays an exact record of the call
    visibleParams(spec, op).forEach((p) => {
      const v = op.params[p.key];
      const shown = p.choices ? p.choices[v]
                  : Number(v).toFixed(decimals(p.step)) + (p.unit ? " " + p.unit : "");
      out.push(`      ${pad(p.label, 22)}${shown}`);
    });
    if (st && st.error) out.push(`      !! ${st.error}`);
    out.push("");
  });

  out.push("Reproduce");
  out.push("---------");
  // every param of every block, disabled ones included (run_pipeline skips
  // them), so this is an exact record -- and what Import TXT reads back
  out.push("import cv2, pipeline");
  out.push("OPS = [");
  pipe.forEach((op) => {
    const params = Object.fromEntries(SCHEMA.operations[op.type].params.map((p) => [p.key, op.params[p.key]]));
    out.push(`    {"type": ${JSON.stringify(op.type)}, "params": ${JSON.stringify(params)}, ` +
             `"enabled": ${op.enabled ? "True" : "False"}},`);
  });
  out.push("]");
  out.push(`stages = pipeline.run_pipeline(cv2.imread(${JSON.stringify(src.path)}), OPS)`);
  out.push("final = stages[-1][\"state\"]   # image, labels, features, feature_names, ...");
  out.push(`cv2.imwrite(${JSON.stringify(stem() + ".png")}, final["image"])`);
  if (live.some((o) => o.type === "foreground")) {
    out.push(`cv2.imwrite(${JSON.stringify(stem("mask") + ".png")}, final["mask"])   # 0/255, source size`);
  }
  out.push("");
  return out.join("\n");
}

const pad2 = (n) => String(n).padStart(2, "0");

function stamp() {
  const t = new Date();
  return `${t.getFullYear()}${pad2(t.getMonth() + 1)}${pad2(t.getDate())}-${pad2(t.getHours())}${pad2(t.getMinutes())}${pad2(t.getSeconds())}`;
}

// e.g. bear__00000-segmentation
function stem(kind = "segmentation") {
  const name = SCHEMA.source.path.split("/").pop().replace(/\.[^.]+$/, "");
  return `${name}-${kind}`;
}

function download(blob, name) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = name;
  a.click();
  URL.revokeObjectURL(url);
}

/* Import reads back the Reproduce section of an Export TXT file: one
 * block per line between `OPS = [` and `]`, each a Python dict literal that
 * is also JSON once True/False are lowercased.  The image comes from the
 * run_pipeline line.  Blocks go through rebuild(), so a file written by an
 * older version -- renamed params, dropped ops, moved ranges -- still loads. */
function parsePipelineText(text) {
  const lines = text.split(/\r?\n/);
  const at = lines.findIndex((l) => l.trim() === "OPS = [");
  if (at < 0) throw new Error("no OPS = [ ... ] block -- is this an Export TXT file?");
  const ops = [];
  for (let i = at + 1; i < lines.length; i++) {
    const line = lines[i].trim();
    if (line === "]") break;
    if (!line) continue;
    const json = line.replace(/,$/, "").replace(/\bTrue\b/g, "true").replace(/\bFalse\b/g, "false");
    try { ops.push(JSON.parse(json)); }
    catch (err) { throw new Error(`line ${i + 1} is not a block: ${line.slice(0, 60)}`); }
  }
  const m = text.match(/run_pipeline\(cv2\.imread\("([^"]+)"\)/);
  return { ops, image: m ? m[1] : null };
}

function importPipeline(text, filename) {
  const { ops, image } = parsePipelineText(text);
  const rebuilt = rebuild(ops);
  if (!rebuilt) throw new Error("none of the blocks in that file exist any more");
  const dropped = ops.length - rebuilt.length;

  pipe = rebuilt;
  followFinal = true;
  renderBlocks();

  const known = image && images.find((e) => e.image === image);
  const note = [`imported ${filename}`];
  if (dropped) note.push(`${dropped} unknown block${dropped > 1 ? "s" : ""} skipped`);
  if (image && !known) note.push(`image ${image} not in manifest, kept current`);
  if (known && image !== SCHEMA.source.path) switchImage(image);   // runs once loaded
  else run();
  setBusy(note.join(" · "));
  setTimeout(clearBusy, 3000);
}

$("importtxt").onclick = () => { if (ready) $("importfile").click(); };
$("importfile").onchange = async () => {
  const file = $("importfile").files[0];
  $("importfile").value = "";          // so picking the same file again still fires
  if (!file) return;
  try {
    importPipeline(await file.text(), file.name);
  } catch (err) {
    console.error(err);
    $("sname").textContent = `Import failed: ${err.message}`;
  }
};

$("exporttxt").onclick = () => {
  if (!ready || !stages.length) return;
  download(new Blob([pipelineText()], { type: "text/plain" }), `${stem()}-${stamp()}.txt`);
};

$("exportbtn").onclick = () => startExport($("exportbtn"), "image");
$("exportmask").onclick = () => startExport($("exportmask"), "mask");

boot();
</script>
</body>
</html>
